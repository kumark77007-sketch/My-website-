<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Earnings - My Movie Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .amount {
      font-size: 30px;
      font-weight: bold;
    }

    .status {
      color: #b00020;
      font-weight: bold;
    }
    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyUdcXAXj6Pr7fnbKksGnwKDo2nlG5gAM",
    authDomain: "k-filmy-movies.firebaseapp.com",
    projectId: "k-filmy-movies",
    storageBucket: "k-filmy-movies.firebasestorage.app",
    messagingSenderId: "638265445029",
    appId: "1:638265445029:web:d6138efd0e12de4f6d5b4c",
    measurementId: "G-9ZPFG9T558"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    }
  });
</script>
  </style>
</head>

<body>

<header>
  <h1>💰 Earnings Dashboard</h1>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <h2>💵 Total Earnings</h2>
      <div class="amount">₹0</div>
    </div>

    <div class="card">
      <h2>📅 This Month</h2>
      <div class="amount">₹0</div>
    </div>

    <div class="card">
      <h2>📈 Today</h2>
      <div class="amount">₹0</div>
    </div>

    <div class="card">
      <h2>💳 Payment</h2>
      <p class="status">Not Connected</p>
    </div>

  </div>

</div>

</body>
</html>
