<html>

<head>

  <style>
    body {

      border-radius: 50%;
      object-fit: cover;

    h1 {
      color: darkblue;
    }

      font-size: 20px;
    }

      color: white;

      border: none;
      border-radius: 8px;
    }

</head>

<body>

  <img src="photo.jpg" alt="Meri Photo" class="photo">

  <h1>Namaste! 👋</h1>

  <p>Ye meri pehli beautiful website hai.</p>

  <button onclick="showMessage()">Click Me</button>

  <script>
    function showMessage() {
      alert("Hello! Aapne button click kiya 🎉");
    }
  </script>

</body>

</html>
