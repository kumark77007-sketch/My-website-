<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comments - My Movie Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea {
      height: 100px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      cursor: pointer;
      margin-top: 5px;
    }

    .comment {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }

    .delete {
      background: #b00020;
    }

    .comment-name {
      font-weight: bold;
      margin-bottom: 5px;
    }
    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyUdcXAXj6Pr7fnbKksGnwKDo2nlG5gAM",
    authDomain: "k-filmy-movies.firebaseapp.com",
    projectId: "k-filmy-movies",
    storageBucket: "k-filmy-movies.firebasestorage.app",
    messagingSenderId: "638265445029",
    appId: "1:638265445029:web:d6138efd0e12de4f6d5b4c",
    measurementId: "G-9ZPFG9T558"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    }
  });
</script>
  </style>
</head>

<body>

<div class="container">

  <h1>💬 Comments</h1>

  <div class="box">
    <h2>Leave a Comment</h2>

    <input
      type="text"
      id="commentName"
      placeholder="Your name"
    >

    <textarea
      id="commentText"
      placeholder="Write your comment..."
    ></textarea>

    <button onclick="addComment()">
      💬 Post Comment
    </button>
  </div>

  <div class="box">
    <h2>All Comments</h2>

    <div id="commentsList"></div>
  </div>

</div>

<script>

let comments =
  JSON.parse(localStorage.getItem("myComments")) || [];

function saveComments() {
  localStorage.setItem(
    "myComments",
    JSON.stringify(comments)
  );
}

function displayComments() {

  const list =
    document.getElementById("commentsList");

  if (comments.length === 0) {
    list.innerHTML = "<p>No comments yet.</p>";
    return;
  }

  list.innerHTML = "";

  comments.forEach(function(comment, index) {

    const div = document.createElement("div");

    div.className = "comment";

    div.innerHTML = `
      <div class="comment-name">
        👤 ${escapeHTML(comment.name)}
      </div>

      <p>${escapeHTML(comment.text)}</p>

      <button
        class="delete"
        onclick="deleteComment(${index})">
        🗑️ Delete
      </button>
    `;

    list.appendChild(div);
  });
}

function addComment() {

  const name =
    document.getElementById("commentName")
      .value.trim();

  const text =
    document.getElementById("commentText")
      .value.trim();

  if (name === "" || text === "") {
    alert("Please enter your name and comment.");
    return;
  }

  comments.push({
    name: name,
    text: text
  });

  saveComments();

  document.getElementById("commentName").value = "";
  document.getElementById("commentText").value = "";

  displayComments();
}

function deleteComment(index) {

  comments.splice(index, 1);

  saveComments();

  displayComments();
}

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

displayComments();

</script>

</body>
</html>
