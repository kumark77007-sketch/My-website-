<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings - My Movie Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      transition: 0.3s;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .settings-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    /* Dark Mode */
    body.dark-mode {
      background: #121212;
      color: white;
    }

    body.dark-mode .settings-box {
      background: #1e1e1e;
      color: white;
    }

    body.dark-mode input,
    body.dark-mode textarea,
    body.dark-mode select {
      background: #2b2b2b;
      color: white;
      border-color: #555;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚙️ Website Settings</h1>
  </header>

  <div class="container">

    <div class="settings-box">

      <!-- Website Name -->
      <label for="websiteName">
        🌐 Website Name
      </label>

      <input
        type="text"
        id="websiteName"
        placeholder="Enter website name"
      >


      <!-- Website Description -->
      <label for="websiteDescription">
        📝 Website Description
      </label>

      <textarea
        id="websiteDescription"
        placeholder="Enter website description"
      ></textarea>


      <!-- Theme -->
      <label for="websiteTheme">
        🎨 Website Theme
      </label>

      <select id="websiteTheme">
        <option value="light">☀️ Light</option>
        <option value="dark">🌙 Dark</option>
      </select>


      <!-- Save Button -->
      <button onclick="saveSettings()">
        💾 Save Settings
      </button>

      <div id="message"></div>

    </div>

  </div>


  <script>

    /* Save Settings */
    function saveSettings() {

      const name =
        document.getElementById("websiteName").value.trim();

      const description =
        document.getElementById("websiteDescription").value.trim();

      const theme =
        document.getElementById("websiteTheme").value;


      /* Save to browser */
      localStorage.setItem("websiteName", name);

      localStorage.setItem(
        "websiteDescription",
        description
      );

      localStorage.setItem(
        "websiteTheme",
        theme
      );

      /* Also save dark mode setting */
      if (theme === "dark") {
        localStorage.setItem("darkMode", "on");
      } else {
        localStorage.setItem("darkMode", "off");
      }


      /* Apply theme immediately */
      applyTheme();


      /* Success message */
      document.getElementById("message").innerText =
        "✅ Settings saved successfully!";

    }


    /* Load saved settings */
    function loadSettings() {

      document.getElementById("websiteName").value =
        localStorage.getItem("websiteName") || "";

      document.getElementById("websiteDescription").value =
        localStorage.getItem("websiteDescription") || "";

      document.getElementById("websiteTheme").value =
        localStorage.getItem("websiteTheme") || "light";

    }


    /* Apply Theme */
    function applyTheme() {

      const theme =
        localStorage.getItem("websiteTheme") || "light";

      if (theme === "dark") {

        document.body.classList.add("dark-mode");

      } else {

        document.body.classList.remove("dark-mode");

      }

    }


    /* Start */
    loadSettings();
    applyTheme();

  </script>

</body>

</html>
