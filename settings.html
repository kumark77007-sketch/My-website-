<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings - My Movie Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .settings-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>⚙️ Website Settings</h1>
</header>

<div class="container">

  <div class="settings-box">

    <label>Website Name</label>
    <input
      type="text"
      id="websiteName"
      placeholder="Enter website name"
    >

    <label>Website Description</label>
    <textarea
      id="websiteDescription"
      placeholder="Enter website description"
    ></textarea>

    <button onclick="saveSettings()">
      💾 Save Settings
    </button>

    <div id="message"></div>

  </div>

</div>

<script>

function saveSettings() {

  const name =
    document.getElementById("websiteName").value.trim();

  const description =
    document.getElementById("websiteDescription").value.trim();

  localStorage.setItem("websiteName", name);
  localStorage.setItem("websiteDescription", description);

  document.getElementById("message").innerText =
    "✅ Settings saved successfully!";
}

function loadSettings() {

  document.getElementById("websiteName").value =
    localStorage.getItem("websiteName") || "";

  document.getElementById("websiteDescription").value =
    localStorage.getItem("websiteDescription") || "";
}

loadSettings();

</script>

</body>
</html>
