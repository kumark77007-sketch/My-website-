<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings - My Movie Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      transition: 0.3s;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .settings-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    /* Dark Mode */
    body.dark-mode {
      background: #121212;
      color: white;
    }

    body.dark-mode .settings-box {
      background: #1e1e1e;
      color: white;
    }

    body.dark-mode input,
    body.dark-mode textarea,
    body.dark-mode select {
      background: #333;
      color: white;
      border-color: #555;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚙️ Website Settings</h1>
  </header>

  <div class="container">

    <div class="settings-box">

      <label for="websiteName">
        🌐 Website Name
      </label>

      <input
        type="text"
        id="websiteName"
        placeholder="Enter website name"
      >


      <label for="websiteDescription">
        📝 Website Description
      </label>

      <textarea
        id="websiteDescription"
        placeholder="Enter website description"
      ></textarea>


      <label for="darkMode">
        🌙 Website Theme
      </label>

      <select id="darkMode">
        <option value="off">☀️ Light Mode</option>
        <option value="on">🌙 Dark Mode</option>
      </select>


      <button onclick="saveSettings()">
        💾 Save Settings
      </button>

      <div id="message"></div>

    </div>

  </div>


  <script>

    function saveSettings() {

      const name =
        document.getElementById("websiteName").value.trim();

      const description =
        document.getElementById("websiteDescription").value.trim();

      const darkMode =
        document.getElementById("darkMode").value;


      /* Save Website Name */
      localStorage.setItem(
        "websiteName",
        name
      );


      /* Save Website Description */
      localStorage.setItem(
        "websiteDescription",
        description
      );


      /* Save Dark Mode */
      localStorage.setItem(
        "darkMode",
        darkMode
      );


      /* Apply Dark Mode */
      if (darkMode === "on") {

        document.body.classList.add("dark-mode");

      } else {

        document.body.classList.remove("dark-mode");

      }


      document.getElementById("message").innerText =
        "✅ Settings saved successfully!";

    }


    function loadSettings() {

      const savedName =
        localStorage.getItem("websiteName");

      const savedDescription =
        localStorage.getItem("websiteDescription");

      const savedDarkMode =
        localStorage.getItem("darkMode");


      if (savedName) {

        document.getElementById("websiteName").value =
          savedName;

      }


      if (savedDescription) {

        document.getElementById("websiteDescription").value =
          savedDescription;

      }


      if (savedDarkMode) {

        document.getElementById("darkMode").value =
          savedDarkMode;

      }


      /* Apply saved Dark Mode */

      if (savedDarkMode === "on") {

        document.body.classList.add("dark-mode");

      }

    }


    loadSettings();

  </script>

</body>

</html>
