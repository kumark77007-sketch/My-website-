<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stats - @K Filmy Movies</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .icon {
      font-size: 35px;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📊 Website Stats</h1>
  </header>

  <div class="container">

    <div class="stats">

      <div class="card">
        <div class="icon">👀</div>
        <h2>Total Visits</h2>
        <div class="number" id="totalVisits">0</div>
      </div>

      <div class="card">
        <div class="icon">🎬</div>
        <h2>Total Movies</h2>
        <div class="number">3</div>
      </div>

      <div class="card">
        <div class="icon">💬</div>
        <h2>Total Comments</h2>
        <div class="number" id="totalComments">0</div>
      </div>

      <div class="card">
        <div class="icon">📝</div>
        <h2>Total Posts</h2>
        <div class="number" id="totalPosts">0</div>
      </div>

    </div>

  </div>

  <script>

    /* Count Stats Page Visits */

    let visits =
      Number(localStorage.getItem("websiteVisits")) || 0;

    visits++;

    localStorage.setItem(
      "websiteVisits",
      visits
    );

    document.getElementById("totalVisits").innerText =
      visits;


    /* Count Comments */

    const comments =
      JSON.parse(
        localStorage.getItem("movieComments") || "[]"
      );

    document.getElementById("totalComments").innerText =
      comments.length;


    /* Count Posts */

    const posts =
      JSON.parse(
        localStorage.getItem("myPosts") || "[]"
      );

    document.getElementById("totalPosts").innerText =
      posts.length;

  </script>

</body>

</html>
